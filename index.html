<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#24180f">
    <title>Convite para ranking · Cagada Remunerada</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f8f1e6; color: #24180f; }
      main { width: min(100%, 440px); padding: clamp(24px, 7vw, 40px); border: 2px solid #24180f; border-radius: 24px; background: #fffaf1; box-shadow: 8px 8px 0 #24180f; }
      .eyebrow { margin: 0 0 12px; color: #655018; font-size: .8rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
      h1 { margin: 0 0 16px; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; }
      p { line-height: 1.5; }
      .code { display: block; margin: 24px 0; padding: 16px; border: 2px dashed #24180f; border-radius: 14px; background: #fff0b5; text-align: center; font-size: clamp(1.5rem, 8vw, 2.25rem); font-weight: 900; letter-spacing: .16em; }
      .button { display: block; width: 100%; min-height: 52px; padding: 14px 20px; border: 2px solid #24180f; border-radius: 14px; background: #d7ee70; color: #24180f; text-align: center; text-decoration: none; font: inherit; font-weight: 800; cursor: pointer; }
      .button.secondary { margin-top: 12px; background: transparent; }
      .note { margin-bottom: 0; font-size: .9rem; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Cagada Remunerada</p>
      <h1>Você recebeu um convite.</h1>
      <p id="description">No iPhone, abra o app para entrar no ranking com seus amigos.</p>
      <strong id="code" class="code" hidden></strong>
      <a id="open" class="button" hidden>Abrir no iPhone</a>
      <button id="copy" class="button secondary" type="button" hidden>Copiar código</button>
      <p id="note" class="note">Se o app ainda não estiver instalado, peça o acesso a quem enviou o convite.</p>
    </main>
    <script>
      const raw = new URLSearchParams(location.search).get('invite') || '';
      const code = raw.trim().toUpperCase();
      const valid = /^[A-Z2-9]{6}$/.test(code);
      if (valid) {
        document.getElementById('code').textContent = code;
        document.getElementById('code').hidden = false;
        const open = document.getElementById('open');
        open.href = `cagadaremunerada://app/invite/${code}`;
        open.hidden = false;
        const copy = document.getElementById('copy');
        copy.hidden = false;
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(code);
            copy.textContent = 'Código copiado';
          } catch (_) {
            copy.textContent = `Código: ${code}`;
          }
        });
      } else {
        document.getElementById('description').textContent = 'Este convite não tem um código válido. Peça um novo link a quem convidou você.';
      }
    </script>
  </body>
</html>
